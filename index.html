<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Cost Calculator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        body { 
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        h2 { 
            text-align: center; 
            color: var(--text-dark);
            margin-top: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
            font-weight: 600;
        }

        .input-group { margin-top: 15px; }

        label { 
            display: block; 
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button { 
            margin-top: 25px; 
            padding: 14px; 
            width: 100%; 
            font-size: 1.1rem; 
            font-weight: 600;
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 12px;
            cursor: pointer; 
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 6px -1px rgba(46, 204, 113, 0.3);
        }

        button:hover { 
            background: var(--secondary-color); 
            transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }

        button.btn-copy {
            background: #34495e;
            margin-top: 10px;
        }
        
        button.btn-copy:hover { background: #2c3e50; }

        .result-card { 
            background: #f8fafc; 
            padding: 20px; 
            margin-top: 25px; 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            display: none; /* ซ่อนไว้ก่อนคำนวณ */
        }

        .result-header {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 10px;
        }

        .result-text {
            white-space: pre-line;
            line-height: 1.6;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .highlight-cost {
            font-size: 1.4rem;
            color: var(--secondary-color);
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏸 ค่าแบดมินตัน</h2>

    <div class="input-group">
        <label>📅 วันที่</label>
        <input type="date" id="playDate">
    </div>

    <div class="section-title">👥 ข้อมูลสมาชิก</div>
    <div class="grid-2">
        <div class="input-group">
            <label>คนทั้งหมด</label>
            <input type="number" id="numPeople" placeholder="0">
        </div>
        <div class="input-group">
            <label>มา 1 ชม. (50฿)</label>
            <input type="number" id="numOneHour" placeholder="0">
        </div>
    </div>

    <div class="section-title">🕒 ค่าสนาม</div>
    <div class="grid-2">
        <div class="input-group">
            <label>บาท/ชั่วโมง</label>
            <input type="number" id="courtRate" value="150">
        </div>
        <div class="input-group">
            <label>จำนวนชั่วโมง</label>
            <input type="number" id="hours" placeholder="0">
        </div>
    </div>

    <div class="section-title">🏸 ค่าลูกแบด</div>
    <label>ชุดที่ 1 (ราคาหลอด / จำนวนลูกที่ใช้)</label>
    <div class="grid-2">
        <input type="number" id="shuttleRate1" placeholder="ราคาหลอด">
        <input type="number" id="numShuttle1" placeholder="ลูกที่ใช้">
    </div>

    <label style="margin-top:10px;">ชุดที่ 2 (ราคาหลอด / จำนวนลูกที่ใช้)</label>
    <div class="grid-2">
        <input type="number" id="shuttleRate2" placeholder="ราคาหลอด">
        <input type="number" id="numShuttle2" placeholder="ลูกที่ใช้">
    </div>

    <button onclick="calculate()">🚀 คำนวณค่าใช้จ่าย</button>

    <div class="result-card" id="resultCard">
        <div class="result-header">📊 สรุปยอดจ่ายเงิน</div>
        <div class="result-text" id="resultText"></div>
        <div class="highlight-cost" id="perPersonResult"></div>
        <button class="btn-copy" onclick="copySummary()">📋 คัดลอกสรุปส่งกลุ่ม</button>
    </div>
</div>

<script>
window.onload = function() {
    const today = new Date();
    document.getElementById('playDate').value = today.toISOString().split('T')[0];
}

let summaryText = "";

function calculate() {
    const date = document.getElementById('playDate').value;
    const numPeople = parseFloat(document.getElementById('numPeople').value) || 0;
    const numOneHour = parseFloat(document.getElementById('numOneHour').value) || 0;
    const courtRate = parseFloat(document.getElementById('courtRate').value) || 0;
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    
    const shuttleRate1Tube = parseFloat(document.getElementById('shuttleRate1').value) || 0;
    const shuttleRate2Tube = parseFloat(document.getElementById('shuttleRate2').value) || 0;
    const shuttleRate1PerPiece = shuttleRate1Tube / 12;
    const shuttleRate2PerPiece = shuttleRate2Tube / 12;
    
    const numShuttle1 = parseFloat(document.getElementById('numShuttle1').value) || 0;
    const numShuttle2 = parseFloat(document.getElementById('numShuttle2').value) || 0;

    const totalCourt = courtRate * hours;
    const totalShuttle = (shuttleRate1PerPiece * numShuttle1) + (shuttleRate2PerPiece * numShuttle2);
    const totalBeforeOneHour = totalCourt + totalShuttle;

    const oneHourCost = numOneHour * 50;
    const totalAdjusted = totalBeforeOneHour - oneHourCost;
    const remainingPeople = numPeople - numOneHour;
    const perPerson = remainingPeople > 0 ? Math.ceil(totalAdjusted / remainingPeople) : 0; 

    // แสดง Result Card
    document.getElementById('resultCard').style.display = 'block';

    // สร้างข้อความสรุป
    summaryText = `📅 วันที่: ${date}\n` +
                  `👥 จำนวนทั้งหมด: ${numPeople} คน\n` +
                  `🏸 ค่าคอร์ท: ${totalCourt.toLocaleString()} บาท\n` +
                  `🪶 ค่าลูก: ${totalShuttle.toFixed(2)} บาท\n` +
                  `💰 ยอดรวม: ${totalBeforeOneHour.toFixed(2)} บาท\n` +
                  `--- สรุป ---\n` +
                  `👤 มา 1 ชม. (${numOneHour} คน): จ่ายคนละ 50.-\n` +
                  `💸 ที่เหลือหารคนละ: ${perPerson} บาท`;

    document.getElementById('resultText').textContent = 
        `สนาม: ${totalCourt.toFixed(2)}.- | ลูก: ${totalShuttle.toFixed(2)}.-\n` +
        `หักยอดคนตี 1 ชม. แล้วเหลือ: ${totalAdjusted.toFixed(2)}.-`;
    
    document.getElementById('perPersonResult').textContent = `จ่ายคนละ ${perPerson} บาท`;
}

function copySummary() {
    if (!summaryText) return;
    navigator.clipboard.writeText(summaryText).then(() => {
        alert("คัดลอกลง Clipboard แล้ว!");
    });
}
</script>

</body>
</html>
