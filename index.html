<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คำนวณค่าใช้จ่ายตีแบด (ปรับปรุงสวยงาม)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
            --text-light: #475569;
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        body { 
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            padding: 15px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden; 
        }

        h2 { 
            text-align: center; 
            color: var(--text-dark);
            margin-top: 0;
            font-size: 1.5rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--secondary-color);
            margin-top: 25px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 5px;
            font-weight: 600;
        }

        .input-group { margin-top: 15px; width: 100%; }

        label { 
            display: block; 
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 8px;
            font-weight: 400;
        }

        input { 
            width: 100%; 
            max-width: 100%; 
            padding: 12px 15px; 
            border: 2px solid #e2e8f0; 
            border-radius: 10px;
            font-size: 16px; 
            transition: all 0.3s ease;
            outline: none;
            background: #f8fafc;
        }

        input:focus:not([readonly]) {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
        }

        /* 🎨 สไตล์สำหรับช่องวันที่ที่ถูกล็อค */
        input[readonly] {
            background-color: #e2e8f0;
            color: #475569;
            cursor: not-allowed;
            border-color: #cbd5e1;
            font-weight: 600;
            text-align: center;
        }

        button { 
            margin-top: 25px; 
            padding: 15px; 
            width: 100%; 
            font-size: 1.1rem; 
            font-weight: 600;
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 12px;
            cursor: pointer; 
            transition: all 0.2s;
        }

        button:hover { 
            background: var(--secondary-color); 
            transform: translateY(-2px);
        }

        button.btn-copy {
            background: #34495e;
            margin-top: 15px;
        }
        
        button.btn-copy:hover { background: #2c3e50; }

        .result-card { 
            background: #ffffff; 
            padding: 20px; 
            margin-top: 25px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0;
            display: none; 
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .result-text {
            white-space: pre-line;
            line-height: 1.6;
            color: var(--text-dark);
            font-size: 1rem;
        }

        @media screen and (max-width: 480px) {
            .container { padding: 20px 15px; }
            h2 { font-size: 1.3rem; }
            input { padding: 10px 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 ค่าใช้จ่ายตีแบด MTT Badminton</h2>

    <div class="input-group">
        <label> วันที่ </label>
        <input type="text" id="playDate" readonly>
    </div>

    <div class="section-title">ข้อมูลผู้เล่น</div>
    <div class="input-group">
        <label>จำนวนคนทั้งหมด</label>
        <input type="number" id="numPeople" value="0">
    </div>
    <div class="input-group">
        <label>จำนวนคนที่มาตี 1 ชั่วโมง (คนละ 50 บาท)</label>
        <input type="number" id="numOneHour" value="0">
    </div>

    <div class="section-title">ข้อมูลสนาม</div>
    <div class="input-group">
        <label>ราคาคอร์ท/ชั่วโมง</label>
        <input type="number" id="courtRate" value="150">
    </div>
    <div class="input-group">
        <label>จำนวนชั่วโมง</label>
        <input type="number" id="hours" value="0">
    </div>

    <div class="section-title">ข้อมูลลูกแบดมินตัน</div>
    <div class="input-group">
        <label>ราคาลูกชุดที่1 (12 ลูก)ใส่ราคาต่อหลอด</label>
        <input type="number" id="shuttleRate1" value="0">
    </div>
    <div class="input-group">
        <label>จำนวนลูกที่ใช้ ชุดที่ 1 (ใส่จำนวนลูก)</label>
        <input type="number" id="numShuttle1" value="0">
    </div>

    <div class="input-group">
        <label>ราคาลูกชุดที่2 (12 ลูก)ใส่ราคาต่อหลอด</label>
        <input type="number" id="shuttleRate2" value="0">
    </div>
    <div class="input-group">
        <label>จำนวนลูกที่ใช้ชุดที่ 2 (ใส่จำนวนลูก)</label>
        <input type="number" id="numShuttle2" value="0">
    </div>

    <button onclick="calculate()">คำนวณ</button>

    <div class="result-card" id="resultCard">
        <div class="result-text" id="resultText"></div>
        <button class="btn-copy" onclick="copySummary()">📋 คัดลอกสรุปเพื่อส่งแชท</button>
    </div>
</div>

<script>
window.onload = function() {
    // กำหนดวันที่ให้เป็นภาษาไทยแบบสวยงาม
    const today = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    const thaiDate = today.toLocaleDateString('th-TH', options);
    
    // ใส่ค่าลงในช่อง input
    document.getElementById('playDate').value = thaiDate;
}

let summaryText = "";

function calculate() {
    const date = document.getElementById('playDate').value;
    const numPeople = parseFloat(document.getElementById('numPeople').value) || 0;
    const numOneHour = parseFloat(document.getElementById('numOneHour').value) || 0;
    const courtRate = parseFloat(document.getElementById('courtRate').value) || 0;
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    
    const shuttleRate1Tube = parseFloat(document.getElementById('shuttleRate1').value) || 0;
    const shuttleRate2Tube = parseFloat(document.getElementById('shuttleRate2').value) || 0;
    const shuttleRate1PerPiece = shuttleRate1Tube / 12; 
    const shuttleRate2PerPiece = shuttleRate2Tube / 12; 
    
    const numShuttle1 = parseFloat(document.getElementById('numShuttle1').value) || 0;
    const numShuttle2 = parseFloat(document.getElementById('numShuttle2').value) || 0;

    const totalCourt = courtRate * hours;
    const totalShuttle = (shuttleRate1PerPiece * numShuttle1) + (shuttleRate2PerPiece * numShuttle2);
    const totalBeforeOneHour = totalCourt + totalShuttle;

    const oneHourCost = numOneHour * 50;
    const totalAdjusted = totalBeforeOneHour - oneHourCost;
    
    const remainingPeople = numPeople - numOneHour;
    
    const perPerson = remainingPeople > 0 ? Math.ceil(totalAdjusted / remainingPeople) : 0; 
    
    summaryText = 
`📅 วันที่: ${date}
👥️️ จำนวนคนทั้งหมด : ${numPeople} คน
👤 จำนวนคนที่ตี 1 ชั่วโมง : ${numOneHour}คน
👤 จำนวนคนที่ต้องหารเฉลี่ย : ${remainingPeople} คน
---
💸 ค่าใช้จ่ายรวมทั้งหมด
🏸 ค่าคอร์ท : ${totalCourt.toFixed(2)} บาท
🪶 ค่าลูกทั้งหมด : ${totalShuttle.toFixed(2)} บาท
💰 รวมยอดทั้งหมด : ${totalBeforeOneHour.toFixed(2)} บาท
💰 รวมยอดหลังหักคนตี 1ชม : ${totalAdjusted.toFixed(2)} บาท
สรุป
👤 คนที่ตี 1ชั่วโมง จ่าย 50บาท : ${numOneHour}คน
💸 ค่าใช้จ่ายต่อคน : ${perPerson} บาท`;

    document.getElementById('resultText').textContent = summaryText;
    document.getElementById('resultCard').style.display = 'block';
}

function copySummary() {
    if (!summaryText) { alert("กรุณาคำนวณก่อนคัดลอก"); return; }
    const copyText = summaryText.replace(/ /g, '\u00A0'); 
    navigator.clipboard.writeText(copyText).then(() => {
        alert("คัดลอกสรุปเรียบร้อย! พร้อมส่งในแชท");
    }, () => alert("คัดลอกไม่สำเร็จ"));
}
</script>

</body>
</html>
